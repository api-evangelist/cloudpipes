name: Cloudpipes
description: 'Cloudpipes was a Sofia (Bulgaria) and London-based iPaaS (integration
  platform as a service) that provided a cloud-based integration and workflow-automation
  platform for connecting SaaS applications and automating business processes without
  code. Backed by 500 Global (500 Startups / 500 Istanbul), BrightCap Ventures and
  LAUNCHub Ventures, the company was acquired by Vista-backed Quickbase (Quick Base)
  in August 2019 and its standalone product and developer surface were subsequently
  wound down. This API Evangelist profile is a historical/portfolio record: the
  cloudpipes.com origin is offline (Cloudflare 522) and no live API, developer portal,
  or machine-readable API artifacts remain available to harvest.'
